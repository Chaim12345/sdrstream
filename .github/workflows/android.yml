name: android-apk
on:
  push:
    paths: ['android/**', 'go/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      appIdSuffix:
        description: 'Optional debug applicationId suffix (e.g. dbg) for a side-by-side test build'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs (fail fast, before the expensive build)
        run: |
          echo "event: ${{ github.event_name }}"
          echo "appIdSuffix input: '${{ inputs.appIdSuffix }}'"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${{ inputs.appIdSuffix }}" ]; then
            echo "::error::appIdSuffix arrived EMPTY on a manual dispatch - inputs are not reaching the job; refusing to build the wrong package"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install platform 34
        # android-actions/setup-android@v3 broke (sdkmanager "tools" package
        # removed in cmdline-tools 16.0); use the runner's preinstalled SDK
        # like android-emulator-test.yml does.
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config"
      - name: Unit tests (pure-JVM updater logic)
        working-directory: android
        run: ./gradlew testDebugUnitTest
      - name: Cross-compile Go engine (GOOS=android/arm64)
        run: ./android/fetch-engine.sh
      - name: Build APK
        working-directory: android
        # versionCode must increase for in-place updates; 1000+run_number
        # clears every historical release (highest was 3) and stays
        # monotonic per workflow. Local builds keep the gradle default.
        run: |
          VC=$((1000 + ${{ github.run_number }}))
          if [ -n "${{ inputs.appIdSuffix }}" ]; then
            ./gradlew assembleDebug "-PappIdSuffix=${{ inputs.appIdSuffix }}" "-PversionCode=$VC"
          else
            ./gradlew assembleDebug "-PversionCode=$VC"
          fi
      - name: Assert artifact identity (package, provider, versionCode)
        working-directory: android
        run: |
          set -e
          pip install --quiet androguard
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "artifact: $APK"
          SUFFIX="${{ inputs.appIdSuffix }}" WANT="com.chaim12345.sdrstream" python3 - "$APK" <<'ENDASSERT'
          import os, sys, logging
          logging.disable(logging.CRITICAL)
          from androguard.core.apk import APK
          suffix = os.environ.get("SUFFIX", "")
          want = os.environ["WANT"] + ("." + suffix if suffix else "")
          a = APK(sys.argv[1])
          pkg = a.get_package()
          # get_providers() returns provider CLASS names; the authority lives in
          # the manifest android:authorities attribute.
          ns = '{http://schemas.android.com/apk/res/android}'
          auths = [pr.get(ns + 'authorities') for pr in a.get_android_manifest_xml().iter('provider')]
          print("package:", pkg, "versionCode:", a.get_androidversion_code())
          print("provider authorities:", auths)
          assert pkg == want, f"package mismatch: got {pkg}, want {want}"
          assert want + ".logs" in auths, f"log provider authority {want}.logs missing (got {auths})"
          assert int(a.get_androidversion_code()) >= 1000, "CI build must carry the monotonic versionCode"
          print("identity assertions PASS")
          ENDASSERT
      - name: Sign APK with the stable release key (when secrets are configured)
        # Without the secrets the artifact keeps gradle's per-runner debug
        # signature (ephemeral). With them every build shares one cert, so
        # builds update in place. The private key never enters the repo.
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "no signing secrets configured - keeping gradle's ephemeral debug signature"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          "$APKSIGNER" sign --ks /tmp/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          rm -f /tmp/release.keystore
          "$APKSIGNER" verify --print-certs "$APK"
          pip install --quiet androguard
          python3 ../scripts/apk-signer-fp.py "$APK"
          APKSIGNER_SHA=$("$APKSIGNER" verify --print-certs "$APK" | grep -oP 'SHA-256 digest: \K[0-9a-f]+' | head -1)
          ANDRO_SHA=$(python3 ../scripts/apk-signer-fp.py "$APK" | grep -oP 'v2 SHA-256: \K[0-9A-F:]+' | tr -d ':' | tr 'A-F' 'a-f')
          echo "apksigner: $APKSIGNER_SHA"; echo "androguard: $ANDRO_SHA"
          [ -n "$APKSIGNER_SHA" ] && [ "$APKSIGNER_SHA" = "$ANDRO_SHA" ] || { echo "::error::signer digest mismatch between apksigner and androguard"; exit 1; }
          echo "signer cross-check PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: sdrstream-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
