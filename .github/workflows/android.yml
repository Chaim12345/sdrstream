name: android-apk
on:
  push:
    paths: ['android/**', 'go/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install platform 34
        # android-actions/setup-android@v3 broke (sdkmanager "tools" package
        # removed in cmdline-tools 16.0); use the runner's preinstalled SDK
        # like android-emulator-test.yml does.
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config"
      - name: Cross-compile Go engine (GOOS=android/arm64)
        run: ./android/fetch-engine.sh
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sdrstream-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
