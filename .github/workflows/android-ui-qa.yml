name: android-ui-qa
on:
  push:
    branches: [feature/qa-tests]
    paths: ['qa/android-ui-qa.sh', '.github/workflows/android-ui-qa.yml', 'qa/android-target-ref.txt']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch or sha) of the app source to build and test'
        required: true
        default: 'fix/android-startup-crash'
jobs:
  ui-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'fix/android-menu-access' }}
          path: app
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: qa-src
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: SDK
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config"
      - name: Build fat (arm64 + native x86_64) APK from ${{ inputs.ref }}
        working-directory: app
        run: |
          echo "app sha: $(git rev-parse HEAD)" | tee ../app-sha.txt
          ./android/fetch-engine.sh
          NDK=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -1)
          mkdir -p android/app/src/main/jniLibs/x86_64
          (cd go && CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang" go build -trimpath -ldflags "-s -w" -o ../android/app/src/main/jniLibs/x86_64/libsdrstreamd.so ./cmd/sdrstream)
          (cd android && ./gradlew assembleDebug -PsdrstreamAbis=arm64-v8a,x86_64)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../fat.apk
          # Variant B: x86_64 engine built CGO_ENABLED=0 (pure-Go resolver, like the shipping arm64 build)
          (cd go && CGO_ENABLED=0 GOOS=android GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../android/app/src/main/jniLibs/x86_64/libsdrstreamd.so ./cmd/sdrstream)
          (cd android && ./gradlew assembleDebug -PsdrstreamAbis=arm64-v8a,x86_64)
          cp android/app/build/outputs/apk/debug/app-debug.apk ../fat-cgo0.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
      - name: UI QA on API 34 emulator (Pixel 6, gesture nav)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            timeout 700 bash -x qa-src/qa/android-ui-qa.sh fat.apk ui 2>&1 | tee -a qa-results-trace.txt
            timeout 600 bash qa-src/qa/android-func-audit.sh cgo1 200 fat.apk 2>&1 | tee -a qa-results-trace.txt
            timeout 600 bash qa-src/qa/android-func-audit.sh cgo0 200 fat-cgo0.apk 2>&1 | tee -a qa-results-trace.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-qa-${{ github.run_id }}
          path: |
            qa-results/**
            qa-results-trace.txt
            app-sha.txt
