name: android-keystore-test

# Runs only on workflow_dispatch (needs the file on the default branch) or on a
# push to the single branch qa/android-key-store-iv-ci that touches this file.
# No other branch and no schedule triggers it. (was: MANUAL ONLY)
# Free GitHub-hosted runner, no secrets, no artifacts beyond test
# reports. Uses dummy values only; never touches real provider keys or consent
# flags. Proves (a) the JVM unit tests run under Gradle, and (b) the real
# AndroidKeyStore accepts SecretStore.put on the fixed code and rejects the
# 9a2bdb6 baseline (caller-provided GCM IV vs. randomized-encryption policy).
on:
  push:
    branches: [qa/android-key-store-iv-ci]
    paths: ['.github/workflows/android-keystore-test.yml']
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Commit whose android/app/src/main is the baseline (expected to FAIL the Keystore test)'
        required: false
        default: '9a2bdb6fdbd2aaedcdbbf672cfb63d7a03500695'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install platform 34
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config"
      - name: JVM unit tests (no engine needed)
        working-directory: android
        run: ./gradlew testDebugUnitTest -PsdrstreamAbis=x86_64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keystore-unit-reports
          path: android/app/build/reports/tests/testDebugUnitTest

  keystore:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [fixed, baseline]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use baseline production source (tests and gradle stay from this ref)
        if: matrix.variant == 'baseline'
        run: git checkout "${{ inputs.baseline_ref || '9a2bdb6fdbd2aaedcdbbf672cfb63d7a03500695' }}" -- android/app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept SDK licenses and install platform 34
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.config"
      - name: Instrumented SecretStore test on API 34 emulator (dummy values)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash -c 'cd android && ./gradlew connectedDebugAndroidTest -PsdrstreamAbis=x86_64 --no-daemon; echo $? > /tmp/keystore_rc'
      - name: Check verdict (instrumentation XML, not exit code alone)
        run: |
          rc=$(cat /tmp/keystore_rc)
          echo "variant=${{ matrix.variant }} gradle_rc=$rc"
          python3 android/ci/keystore_verdict.py "${{ matrix.variant }}" "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keystore-${{ matrix.variant }}-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
