name: android-emulator-test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-emulator-test.yml'
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept SDK licenses and install platform 34
        run: |
          yes | sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          sudo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Cross-compile Go engine (arm64)
        run: ./android/fetch-engine.sh
      - name: Cross-compile Go engine (x86_64 via NDK, emulator-only fallback)
        run: |
          NDK=$(ls -d "$ANDROID_HOME/ndk/"* | sort -V | tail -1)
          echo "using NDK at $NDK"
          mkdir -p android/app/src/main/jniLibs/x86_64
          cd go
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android34-clang" \
            go build -trimpath -ldflags "-s -w" \
            -o ../android/app/src/main/jniLibs/x86_64/libsdrstreamd.so ./cmd/sdrstream
      - name: Build fat test APK (arm64-v8a + x86_64)
        working-directory: android
        run: ./gradlew assembleDebug -PsdrstreamAbis=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: apk-built-fat
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build shipping APK (arm64 only)
        working-directory: android
        run: |
          rm -rf app/src/main/jniLibs/x86_64 app/build/outputs
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-built-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk

  test-released-apk:
    # Reproduces the user report: the APK from release android-debug-0.1.0
    # installed on a fresh API 34 emulator.
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download released APK
        run: curl -sL -o app.apk https://github.com/Chaim12345/sdrstream/releases/download/android-debug-0.1.0/sdrstream-0.1.0-android-arm64-debug.apk
      - name: Run on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash .github/workflows/emulator-test.sh app.apk released
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-released
          path: |
            emu-results/**
          if-no-files-found: warn

  test-built-apk:
    # Verifies the fixed APK from this branch.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: apk-built-arm64
          path: arm64
      - uses: actions/download-artifact@v4
        with:
          name: apk-built-fat
          path: fat
      - name: Run on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: bash .github/workflows/emulator-test.sh arm64/app-debug.apk built fat/app-debug.apk
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-built
          path: |
            emu-results/**
          if-no-files-found: warn
