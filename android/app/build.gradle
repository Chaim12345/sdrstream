plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chaim12345.sdrstream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chaim12345.sdrstream'
        minSdk 26
        targetSdk 34
        versionCode (project.hasProperty('versionCode') ? project.property('versionCode').toInteger() : 5)
        versionName '0.1.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    // The Go engine binary lives in jniLibs/<abi>/libsdrstreamd.so; it must
    // be extracted to disk (nativeLibraryDir) so the service can exec it.
    // CI passes -PsdrstreamAbis=arm64-v8a,x86_64 to also run on the emulator.
    def sdrAbis = (project.findProperty('sdrstreamAbis') ?: 'arm64-v8a').toString().split(',')
    defaultConfig.ndk { abiFilters(*sdrAbis) }
    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Side-by-side on-device test build: ./gradlew assembleDebug
            // -PappIdSuffix=dbg installs as com.chaim12345.sdrstream.dbg
            // next to the release app, no uninstall or data wipe needed.
            // Default builds (CI, QA harness) are unchanged.
            if (project.hasProperty('appIdSuffix')) {
                applicationIdSuffix '.' + project.property('appIdSuffix')
                versionNameSuffix '-' + project.property('appIdSuffix')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
}
