plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chaim12345.sdrstream'
    compileSdk 34

    defaultConfig {
        applicationId 'com.chaim12345.sdrstream'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    // The Go engine binary lives in jniLibs/<abi>/libsdrstreamd.so; it must
    // be extracted to disk (nativeLibraryDir) so the service can exec it.
    defaultConfig.ndk { abiFilters 'arm64-v8a' }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
