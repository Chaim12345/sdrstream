[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrstream"
version = "0.1.0"
description = "Stream, record and decode audio from public WebSDR and OpenWebRX servers, track satellites, and browse it all in a web UI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
keywords = ["sdr", "websdr", "openwebrx", "kiwisdr", "radio", "adpcm",
            "satellite", "satnogs", "tle", "sgp4", "tftp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Ham Radio",
]
dependencies = ["websockets>=11"]

[project.optional-dependencies]
test = ["websockets>=11", "sgp4>=2.20"]
analysis = ["numpy"]
satellites = ["sgp4>=2.20"]

[project.scripts]
sdrstream = "sdrstream.cli:main"

[tool.setuptools]
packages = ["sdrstream"]
